{{- if .Values.networkPolicy.enabled }}
# Ingress: ONLY the broker pods may reach the redeem endpoint.
# Egress: ONLY DNS, the origin serving the broker's JWKS, and the
# configured ServiceX backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "servicex-token-service.fullname" . }}
  labels:
    {{- include "servicex-token-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "servicex-token-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.broker.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.broker.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # DNS — required to resolve the JWKS origin and the ServiceX backend.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # The broker's JWKS endpoint (config.brokerJwksUrl).
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.jwks.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.egress.jwks.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.jwks.port }}

    # The ServiceX backend (config.servicexBackendUrl) — an in-cluster
    # Service, same namespaceSelector/podSelector shape as jwks above.
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.servicexBackend.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.egress.servicexBackend.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.servicexBackend.port }}
{{- end }}
